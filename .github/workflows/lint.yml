name: Lint & Format

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        name: Lint, format & type check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check
